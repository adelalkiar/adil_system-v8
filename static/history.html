<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>سجل الملفات - نظام العادل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ag-grid/31.3.2/ag-grid-community.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:#05050f;color:rgba(255,255,255,.85);
  height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.topbar{height:56px;min-height:56px;background:rgba(5,5,20,.97);border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,#ff6b00,#ff0080,#7c3aed,#06b6d4);animation:flow 3s linear infinite;background-size:200%;}
@keyframes flow{0%{background-position:0%}100%{background-position:200%}}
.tb-brand{display:flex;align-items:center;gap:10px;}
.tb-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #ff6b00;}
.tb-title{font-size:15px;font-weight:900;background:linear-gradient(135deg,#ffd700,#ff6b00,#ff0080);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-links{display:flex;gap:8px;}
.nav-btn{padding:6px 14px;border-radius:8px;font-family:'Cairo',sans-serif;font-size:12px;
  font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6);}
.nav-btn:hover{color:#fff;border-color:#ff6b00;}
.nav-btn.active{background:rgba(255,107,0,.15);border-color:#ff6b00;color:#ff6b00;}
.layout{display:flex;flex:1;overflow:hidden;}
.sidebar{width:280px;min-width:280px;background:rgba(8,8,25,.97);border-left:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;overflow-y:auto;padding:14px;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);}
.sb-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);margin-bottom:12px;}
.filter-row{display:flex;gap:6px;margin-bottom:10px;}
.f-btn{flex:1;padding:7px;border-radius:8px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-family:'Cairo',sans-serif;
  font-size:11px;cursor:pointer;transition:all .2s;text-align:center;}
.f-btn:hover{border-color:#ff6b00;color:#fff;}
.f-btn.active{background:rgba(255,107,0,.15);border-color:#ff6b00;color:#ff6b00;}
.file-item{padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.02);margin-bottom:8px;cursor:pointer;transition:all .2s;}
.file-item:hover{border-color:rgba(255,107,0,.3);background:rgba(255,107,0,.05);}
.file-item.selected{border-color:#ff6b00;background:rgba(255,107,0,.1);}
.file-actions{display:flex;justify-content:flex-end;margin-top:7px;}
.delete-file{padding:3px 8px;border:1px solid rgba(248,113,113,.35);border-radius:6px;background:rgba(248,113,113,.08);color:#fca5a5;font-family:'Cairo',sans-serif;font-size:10px;cursor:pointer;}
.fi-code{font-size:11px;font-family:monospace;color:#ffd700;font-weight:700;margin-bottom:4px;}
.fi-label{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:4px;word-break:break-word;}
.fi-meta{font-size:10px;color:rgba(255,255,255,.3);}
.fi-sys{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-right:4px;}
.sys-adil{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.2);color:#6ee7b7;}
.sys-sap{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.2);color:#c4b5fd;}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.detail-header{padding:12px 16px;background:rgba(8,8,25,.98);border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;flex-wrap:wrap;gap:8px;}
.dh-info{font-size:13px;color:rgba(255,255,255,.7);}
.dh-info span{color:#ffd700;font-weight:700;}
.action-btns{display:flex;gap:8px;flex-wrap:wrap;}
.ab{padding:7px 14px;border-radius:8px;font-family:'Cairo',sans-serif;font-size:12px;
  font-weight:600;cursor:pointer;transition:all .2s;border:1px solid;}
.ab-exp{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#6ee7b7;}
.ab-exp:hover{background:rgba(16,185,129,.2);}
.grid-tb{padding:8px 14px;background:rgba(8,8,25,.99);border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.srch{flex:1;max-width:260px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:6px 12px;color:#fff;font-family:'Cairo',sans-serif;font-size:12px;outline:none;}
.srch:focus{border-color:#ff6b00;}
.tbb{padding:5px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-family:'Cairo',sans-serif;
  font-size:11px;cursor:pointer;transition:all .2s;}
.tbb:hover{background:rgba(255,107,0,.1);border-color:#ff6b00;color:#fff;}
.ag-theme-alpine-dark{
  --ag-background-color:rgba(5,5,20,.97);--ag-header-background-color:rgba(12,12,35,.99);
  --ag-odd-row-background-color:rgba(255,255,255,.012);--ag-row-hover-color:rgba(255,107,0,.06);
  --ag-border-color:rgba(255,255,255,.05);--ag-header-foreground-color:rgba(255,255,255,.8);
  --ag-foreground-color:rgba(255,255,255,.75);--ag-font-family:'Cairo',sans-serif;
  --ag-font-size:12px;--ag-row-height:34px;--ag-header-height:38px;--ag-alpine-active-color:#ff6b00;}
#detailGrid{flex:1;width:100%;}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.empty-icon{font-size:48px;opacity:.3;}
.empty-txt{color:rgba(255,255,255,.3);font-size:14px;}
.stats-row{display:flex;gap:10px;padding:10px 14px;background:rgba(5,5,20,.98);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;flex-wrap:wrap;}
.stat{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;}
.stat-g{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.2);}
.stat-p{background:rgba(124,58,237,.12);color:#c4b5fd;border:1px solid rgba(124,58,237,.2);}
.stat-o{background:rgba(255,107,0,.12);color:#fdba74;border:1px solid rgba(255,107,0,.2);}
.cnt{font-size:10px;color:rgba(255,255,255,.3);margin-right:auto;align-self:center;}
</style>
</head>

    <div style="display:none;flex:1;flex-direction:column;overflow:hidden;" id="detailView">
      <div class="detail-header">
        <div class="dh-info" id="dhInfo">—</div>
        <div class="action-btns">
          <button class="ab ab-exp" id="expBtn" onclick="exportDetail()">💾 تصدير Excel</button>
        </div>
      </div>
      <div class="stats-row" id="statsRow"></div>
      <div class="grid-tb">
        <input type="text" class="srch" placeholder="🔍 بحث..." id="gsrch" oninput="if(gridApi)gridApi.setGridOption('quickFilterText',this.value)">
        <button class="tbb" onclick="if(gridApi)gridApi.autoSizeAllColumns()">↔️ ملاءمة</button>
        <button class="tbb" onclick="clearF()">🔄 مسح</button>
        <div class="cnt" id="rowCnt">0 صف</div>
      </div>
      <div id="detailGrid" class="ag-theme-alpine-dark"></div>
    </div>
  </div>
</div>

<script>
let allFiles=[], curFilter='all', gridApi=null, curFileId=null;

(async()=>{ await loadFiles(); })();

async function loadFiles(){
  const d=await fetch('/api/history').then(r=>r.json());
  allFiles=d; renderList();
}

function filterFiles(type){
  curFilter=type;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('f-'+type.toLowerCase()).classList.add('active');
  renderList();
}

function renderList(){
  const filtered=curFilter==='all'?allFiles:allFiles.filter(f=>f.system_type===curFilter);
  const el=document.getElementById('fileList');
  if(!filtered.length){ el.innerHTML='<div style="color:rgba(255,255,255,.3);text-align:center;padding:20px;font-size:12px;">لا توجد ملفات</div>'; return; }
  el.innerHTML=filtered.map(f=>`
    <div class="file-item" id="fi_${f.id}" onclick="selectFile(${f.id})">
      <div class="fi-code">
        <span class="fi-sys ${f.system_type==='Adil'?'sys-adil':'sys-sap'}">${f.system_type}</span>
        ${f.file_code}
      </div>
      <div class="fi-label">${f.label||'—'}</div>
      <div class="fi-meta">📅 ${f.created_at} | 📊 ${(f.total||0).toLocaleString('ar-IQ')} | 🗒️ ${f.rows} صف</div>
      <div class="file-actions"><button class="delete-file" onclick="deleteFile(event,${f.id},'${String(f.file_code).replace(/'/g,"\\'")}')">🗑 حذف</button></div>
    </div>`).join('');
}

async function deleteFile(event, id, code){
  event.stopPropagation();
  if(!confirm(`حذف الملف ${code} وجميع تفاصيله؟`)) return;
  const response=await fetch(`/api/history/${id}`,{method:'DELETE'});
  const data=await response.json();
  if(!response.ok) throw new Error(data.detail||'تعذر الحذف');
  if(curFileId===id){curFileId=null;document.getElementById('detailView').style.display='none';document.getElementById('emptyState').style.display='flex';}
  await loadFiles();
}

async function selectFile(id){
  curFileId=id;
  document.querySelectorAll('.file-item').forEach(el=>el.classList.remove('selected'));
  document.getElementById('fi_'+id).classList.add('selected');
  const file=allFiles.find(f=>f.id===id);
  document.getElementById('emptyState').style.display='none';
  document.getElementById('detailView').style.display='flex';
  document.getElementById('dhInfo').innerHTML=
    `<span class="fi-sys ${file.system_type==='Adil'?'sys-adil':'sys-sap'}">${file.system_type}</span>
     <span>${file.file_code}</span> — ${file.label||'—'}`;
  const rows=await fetch(`/api/history/${id}`).then(r=>r.json());
  renderGrid(rows, file);
}

function renderGrid(rows, file){
  if(gridApi){ gridApi.destroy(); gridApi=null; }
  const statuses={'مسدد كامل':0,'مسدد جزئي':0,'الأقساط الزائدة':0,'الأسماء الغير موجودة':0};
  let total=0;
  rows.forEach(r=>{ if(statuses[r.status]!==undefined) statuses[r.status]++; total+=r.distributed||0; });
  
  document.getElementById('statsRow').innerHTML=
    `<div class="stat stat-g">✅ مسدد كامل: ${statuses['مسدد كامل']}</div>
     <div class="stat stat-p">⚡ جزئي: ${statuses['مسدد جزئي']}</div>
     <div class="stat stat-o">⚡ فائض/غير موجود: ${(statuses['الأقساط الزائدة']||0)+(statuses['الأسماء الغير موجودة']||0)}</div>
     <div class="stat stat-g" style="margin-right:auto;">💰 الإجمالي: ${total.toLocaleString('ar-IQ')}</div>`;

  const cols=[
    {field:'client_code',headerName:'كود العميل',width:120},
    {field:'invoice_id',headerName:'رقم الفاتورة',width:130},
    {field:'invoice_date',headerName:'تاريخ الفاتورة',width:130},
    {field:'sort_value',headerName:'تسلسل',width:90},
    {field:'original_rem',headerName:'المتبقي الأصلي',width:130,
      valueFormatter:p=>p.value!=null?Number(p.value).toLocaleString('ar-IQ'):''},
    {field:'distributed',headerName:'المبلغ الموزع',width:130,
      cellStyle:{color:'#a78bfa',fontWeight:'bold'},
      valueFormatter:p=>Number(p.value||0).toLocaleString('ar-IQ')},
    {field:'remaining',headerName:'المتبقي بعد التوزيع',width:150,
      cellStyle:p=>p.value>0?{color:'#fb923c'}:null,
      valueFormatter:p=>Number(p.value||0).toLocaleString('ar-IQ')},
    {field:'status',headerName:'الحالة',width:120,
      cellStyle:p=>{
        const c={'مسدد كامل':'#6ee7b7','مسدد جزئي':'#fbbf24','الأقساط الزائدة':'#c4b5fd','الأسماء الغير موجودة':'#fb923c'};
        return {color:c[p.value]||'#fff',fontWeight:'bold'};
      }},
  ];
  // إضافة بيانات extra
  if(rows.length && rows[0].extra){
    Object.keys(rows[0].extra).forEach(k=>{
      if(!cols.find(c=>c.field===k)) cols.push({field:k,headerName:k,width:130});
    });
  }
  const rowData=rows.map(r=>{return {...r,...(r.extra||{})};});
  agGrid.createGrid(document.getElementById('detailGrid'),{
    columnDefs:cols,rowData:rowData,enableRangeSelection:true,enableCellTextSelection:true,
    animateRows:true,pagination:true,paginationPageSize:200,
    defaultColDef:{sortable:true,filter:true,resizable:true,floatingFilter:false},
    onGridReady:p=>{ gridApi=p.api; document.getElementById('rowCnt').textContent=rows.length.toLocaleString('ar')+' صف'; }
  });
}

function clearF(){ if(gridApi){ gridApi.setFilterModel(null); document.getElementById('gsrch').value=''; gridApi.setGridOption('quickFilterText',''); } }
async function exportDetail(){ if(curFileId) window.location.href=`/api/history/${curFileId}/export`; }
</script>
</body>
</html>
